name: TeslaButtons

options:
  bundleIdPrefix: dev.benjiden
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  TeslaBLE:
    url: https://github.com/shoujiaxin/swift-tesla-ble
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your Apple Developer Team ID here (Xcode > Settings > Accounts),
    # or leave blank and pick the team in Signing & Capabilities after generating.
    DEVELOPMENT_TEAM: 48X9Q39ND5
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false

targets:
  TeslaButtons:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: TeslaBLE
        product: TeslaBLE
      - target: TeslaButtonsControls
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tesla Buttons
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Landscape-first: the app is designed for an in-car landscape mount,
        # portrait remains supported for handheld use.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: >-
          Tesla Buttons connects to your vehicle over Bluetooth to send
          commands like opening the frunk and starting climate.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjiden.teslabuttons
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  TeslaButtonsControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - Shared
    dependencies:
      - package: TeslaBLE
        product: TeslaBLE
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Tesla Buttons Controls
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjiden.teslabuttons.controls
